name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    name: Build ${{ matrix.asset }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            target: aarch64-apple-darwin
            asset: forgeindex-aarch64-darwin.tar.gz
          - os: macos-13
            target: x86_64-apple-darwin
            asset: forgeindex-x86_64-darwin.tar.gz
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            asset: forgeindex-x86_64-linux.tar.gz
          - os: ubuntu-24.04-arm
            target: aarch64-unknown-linux-gnu
            asset: forgeindex-aarch64-linux.tar.gz
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            asset: forgeindex-x86_64-windows.zip

    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Build
        run: cargo build --release --target ${{ matrix.target }}

      - name: Package (tar.gz)
        if: ${{ !endsWith(matrix.asset, '.zip') }}
        run: |
          tar czf ${{ matrix.asset }} -C target/${{ matrix.target }}/release forgeindex

      - name: Package (zip)
        if: ${{ endsWith(matrix.asset, '.zip') }}
        shell: pwsh
        run: |
          Compress-Archive -Path target/${{ matrix.target }}/release/forgeindex.exe -DestinationPath ${{ matrix.asset }}

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.asset }}
          path: ${{ matrix.asset }}

  release:
    name: Create GitHub release
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          merge-multiple: true

      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            forgeindex-*.tar.gz
            forgeindex-*.zip
          generate_release_notes: true
